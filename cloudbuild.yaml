# Build → push → deploy, for Cloud Build.
#
#   gcloud builds submit --config cloudbuild.yaml
#
# Database migrations are NOT run here — see scripts/migrate-cloud.sh. Cloud Build
# does not mount the Cloud SQL socket, so a build step cannot reach the database
# without running an auth proxy sidecar; doing it from Cloud Shell is simpler and
# the errors are visible rather than buried in build logs.
#
# Secrets are never substituted into this file. They live in Secret Manager and are
# mounted at deploy time, so they stay out of build logs and out of the image.

substitutions:
  _SERVICE: heykels
  _REGION: us-central1
  _INSTANCE: heykels-db
  _DB_NAME: heykels
  _DB_USER: heykels
  _LOCATION: global

# BUILD_ID, not SHORT_SHA: SHORT_SHA is only populated for builds started by a
# repository trigger. A manual `gcloud builds submit` leaves it empty, which would
# produce the invalid tag "heykels:" and fail the build.
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:${BUILD_ID}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:${BUILD_ID}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:latest"
      - "."

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:${BUILD_ID}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      # Mounts the Cloud SQL socket at /cloudsql/<connection name>.
      - "--add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_INSTANCE}"
      # Vertex AI rather than an API key: the service account already authenticates,
      # so there is no Gemini credential to mint, rotate, or leak, and model usage
      # stays inside the project's own billing and audit trail.
      # AUTH_TRUST_HOST is required by Auth.js v5 on any host that is not Vercel:
      # Cloud Run terminates TLS at its proxy, and without this flag Auth.js
      # rejects the forwarded host header and every sign-in fails (UntrustedHost).
      - "--set-env-vars=CLOUD_SQL_CONNECTION_NAME=${PROJECT_ID}:${_REGION}:${_INSTANCE},DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_LOCATION},AUTH_TRUST_HOST=true"
      - "--set-secrets=DB_PASSWORD=heykels-db-password:latest,AUTH_SECRET=heykels-auth-secret:latest,AUTH_GOOGLE_ID=heykels-google-id:latest,AUTH_GOOGLE_SECRET=heykels-google-secret:latest,APP_ENCRYPTION_KEY=heykels-encryption-key:latest"
      # Streaming needs a long request timeout and CPU that stays awake between
      # tokens; the default throttle stalls a stream mid-answer.
      - "--timeout=300"
      - "--cpu-boost"
      - "--no-cpu-throttling"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--concurrency=40"
