# Build → push → migrate → deploy, for Cloud Build.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions _REGION=us-central1,_INSTANCE=heykels-db
#
# Secrets are never substituted in here. They live in Secret Manager and are mounted
# into the service at deploy time, so they stay out of build logs and the image.

substitutions:
  _SERVICE: heykels
  _REGION: us-central1
  _INSTANCE: heykels-db
  _DB_NAME: heykels
  _DB_USER: heykels
  _LOCATION: global

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:${SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:latest"
      - "."

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}"]

  # Migrations run as their own step, before traffic moves. Running them from the
  # app on boot would race across concurrently starting Cloud Run instances.
  - id: migrate
    name: "${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:${SHORT_SHA}"
    entrypoint: sh
    args:
      - "-c"
      - |
        npx prisma migrate deploy
    env:
      - "CLOUD_SQL_CONNECTION_NAME=${PROJECT_ID}:${_REGION}:${_INSTANCE}"
      - "DB_USER=${_DB_USER}"
      - "DB_NAME=${_DB_NAME}"
    secretEnv: ["DB_PASSWORD"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/heykels/${_SERVICE}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      # Mounts the Cloud SQL socket at /cloudsql/<connection name>.
      - "--add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_INSTANCE}"
      # Vertex AI rather than an API key: the service account already authenticates,
      # so there is no Gemini credential to mint, rotate, or leak. It also keeps model
      # usage inside the project's own billing and audit trail.
      - "--set-env-vars=CLOUD_SQL_CONNECTION_NAME=${PROJECT_ID}:${_REGION}:${_INSTANCE},DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_LOCATION}"
      - "--set-secrets=DB_PASSWORD=heykels-db-password:latest,AUTH_SECRET=heykels-auth-secret:latest,AUTH_GOOGLE_ID=heykels-google-id:latest,AUTH_GOOGLE_SECRET=heykels-google-secret:latest,APP_ENCRYPTION_KEY=heykels-encryption-key:latest"
      # Streaming responses need a long request timeout and CPU that stays awake
      # between tokens; the default throttle would stall the stream mid-answer.
      - "--timeout=300"
      - "--cpu-boost"
      - "--no-cpu-throttling"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--concurrency=40"

availableSecrets:
  secretManager:
    - versionName: "projects/${PROJECT_ID}/secrets/heykels-db-password/versions/latest"
      env: DB_PASSWORD
